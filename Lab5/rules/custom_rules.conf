# Enable ModSecurity Engine and Allow Request Body Access
SecRuleEngine On
SecRequestBodyAccess On

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data(?![;])" \
    "id:10001,phase:1,deny,status:403,log, \
    msg:'Non-canonical multipart Content-Type detected', \
    tag:'attack/malformed-multipart', \
    severity:'CRITICAL'"

SecRule ARGS_NAMES "@contains php_session_upload_progress" \
    "id:10002,\
     phase:2,\
     deny,\
     status:403,\
     log,\
     msg:'PHP session upload progress field detected',\
     tag:'attack/php2shell',\
     severity:CRITICAL"