name: modsec-php-lab
topology:
  nodes:
    sw0:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 bridge-utils
        - ip link add br0 type bridge
        - ip link set dev br0 up
        - ip link set dev eth1 master br0
        - ip link set dev eth2 master br0
        - ip link set dev eth3 master br0
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip link set dev eth3 up
    attacker:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip addr add 10.0.1.1/24 dev eth1
        - ip link set lo up
        - apk add --no-cache curl netcat-openbsd
    phpserver:
      kind: linux
      image: custom-php:latest
      exec:
        - ip link set eth1 up
        - ip addr add 10.0.1.2/24 dev eth1
        - ip link set lo up
    waf:
      kind: linux
      image: custom-waf:latest
      env:
        BACKEND: "http://10.0.1.2:80"
        MODSEC_RULE_ENGINE: "On"
      binds:
        # Mount custom rules into the ModSecurity additional rules directory
        - rules/custom_rules.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-CUSTOM.conf:ro
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip addr add 10.0.1.3/24 dev eth1
        - ip link set lo up
  links:
    - endpoints: ["attacker:eth1", "sw0:eth1"]
    - endpoints: ["waf:eth1", "sw0:eth2"]
    - endpoints: ["phpserver:eth1", "sw0:eth3"]